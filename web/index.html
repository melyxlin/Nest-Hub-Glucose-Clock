<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Glucose Clock</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="stale">
  <button id="settings-button" type="button" aria-haspopup="dialog">Settings</button>
  <button id="enable-sound" type="button">Tap to enable alerts</button>
  <audio id="alert-audio" preload="auto"></audio>
  <section id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="settings-card">
      <h1 id="settings-title">Glucose alerts</h1>
      <div class="setting-row">
        <span class="setting-label">Low below</span>
        <div class="stepper">
          <button type="button" data-setting="low" data-change="-5" aria-label="Lower low threshold">−</button>
          <output id="low-setting" class="threshold-value">70</output>
          <button type="button" data-setting="low" data-change="5" aria-label="Raise low threshold">+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">High above</span>
        <div class="stepper">
          <button type="button" data-setting="high" data-change="-5" aria-label="Lower high threshold">−</button>
          <output id="high-setting" class="threshold-value">180</output>
          <button type="button" data-setting="high" data-change="5" aria-label="Raise high threshold">+</button>
        </div>
      </div>
      <div class="setting-row">
        <label class="setting-label" for="low-sound-setting">Low alert sound</label>
        <input id="low-sound-setting" class="sound-toggle" type="checkbox" checked>
      </div>
      <div class="setting-row">
        <label class="setting-label" for="high-sound-setting">High alert sound</label>
        <input id="high-sound-setting" class="sound-toggle" type="checkbox" checked>
      </div>
      <div id="settings-message" role="status"></div>
      <div class="settings-actions">
        <button id="cancel-settings" type="button">Cancel</button>
        <button id="save-settings" class="save" type="button">Save</button>
      </div>
    </div>
  </section>
  <main>
    <header class="clock" aria-label="Current time and date">
      <div id="time">--:--</div>
      <div id="date">Loading…</div>
    </header>
    <section class="glucose-hero" aria-live="polite" aria-label="Current glucose and trend">
      <div class="value-block">
        <span id="value"></span>
        <span id="units">mg/dL</span>
      </div>
      <div class="trend-block">
        <span id="delta"></span>
        <span id="arrow" aria-hidden="true"></span>
      </div>
      <span id="unavailable">Glucose unavailable</span>
    </section>
    <section class="glucose-history" aria-label="Today's glucose history">
      <svg id="history-chart" viewBox="0 0 800 140" preserveAspectRatio="none" role="img"
        aria-label="Today's glucose graph"></svg>

      <div id="history-empty" class="history-empty" hidden>
        No glucose history available
      </div>
    </section>
    <footer id="metadata">Connecting to Nightscout…</footer>
  </main>
  <script src="/js/app.js"></script>
</body>

</html>
